name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match VERSION' }
      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build/release -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/release --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test
        shell: pwsh
        env:
          MYE_DX11_WARP: '1'
        run: |
          ctest --test-dir build/release -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/verify-foundation.ps1 -Configuration Release -BuildDir build/release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check 2D applications
        shell: pwsh
        env:
          MYE_DX11_WARP: '1'
        run: |
          ./tools/verify-online2d.ps1 -Configuration Release -BuildDir build/release -SavedCamera
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/verify-input-actions.ps1 -Configuration Release -BuildDir build/release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/verify-animation2d.ps1 -Configuration Release -BuildDir build/release -Temporal -StateMaps -Actions
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ./tools/verify-game-ui.py --config Release --build-dir build/release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/mcp/package-lock.json
      - name: Check MCP
        working-directory: tools/mcp
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package
        shell: pwsh
        run: ./tools/package/package.ps1 -BuildDir build/release -OutDir build/packages
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MyEngine-windows-x64
          path: |
            build/packages/*.zip
            build/packages/*.sha256
          if-no-files-found: error
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem build/packages -File | Where-Object Extension -in '.zip','.sha256' | ForEach-Object FullName
          gh release view $env:GITHUB_REF_NAME --json tagName
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "MyEngine $((Get-Content VERSION -Raw).Trim())" --notes-file docs/release-notes.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
